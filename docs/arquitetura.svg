<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-ai" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ec4899"/>
    </marker>
    <marker id="arrow-db" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Título do Diagrama -->
  <text x="500" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">Arquitetura: Livro Digital de Ocorrências com Triagem via IA</text>
  <text x="500" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Estrutura Hierárquica: Super Admin → Síndica → Portaria → Morador</text>

  <!-- 1. CAMADA DE ACESSO (RBAC HIERÁRQUICO) -->
  <g transform="translate(50, 95)" filter="url(#shadow)">
    <rect width="900" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="24" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.5">1. HIERARQUIA DE ACESSO E PAPÉIS (RBAC)</text>
    
    <!-- Nível 1: Super Admin -->
    <rect x="25" y="36" width="195" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="122" y="54" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">1. Super Admin</text>
    <text x="122" y="69" text-anchor="middle" fill="#94a3b8" font-size="10">Multi-Condomínio • QR Code</text>

    <!-- Nível 2: Síndica -->
    <rect x="245" y="36" width="195" height="42" rx="6" fill="#0f172a" stroke="#818cf8"/>
    <text x="342" y="54" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">2. Síndica / Gestão</text>
    <text x="342" y="69" text-anchor="middle" fill="#94a3b8" font-size="10">Triagem • Blocos • Avisos</text>

    <!-- Nível 3: Portaria / Zelador -->
    <rect x="465" y="36" width="195" height="42" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="562" y="54" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">3. Portaria / Zelador</text>
    <text x="562" y="69" text-anchor="middle" fill="#94a3b8" font-size="10">Operacional de Reparos</text>

    <!-- Nível 4: Morador (Atômico) -->
    <rect x="685" y="36" width="190" height="42" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="780" y="54" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">4. Morador (Unidade)</text>
    <text x="780" y="69" text-anchor="middle" fill="#94a3b8" font-size="10">Abertura de Chamado • Mural</text>
  </g>

  <!-- Conexão Camada 1 -> Camada 2 -->
  <path d="M 500 185 L 500 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. CAMADA FRONTEND -->
  <g transform="translate(50, 215)" filter="url(#shadow)">
    <rect width="900" height="95" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="24" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.5">2. FRONTEND (REACT 19 + TYPESCRIPT + VITE)</text>

    <!-- Interface -->
    <rect x="25" y="36" width="265" height="46" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="157" y="56" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Interface &amp; Navegação</text>
    <text x="157" y="71" text-anchor="middle" fill="#94a3b8" font-size="10">Tailwind CSS v3 • Radix UI • Touch 44px</text>

    <!-- Sanitizador -->
    <rect x="315" y="36" width="270" height="46" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="450" y="56" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Sanitizador de Entradas</text>
    <text x="450" y="71" text-anchor="middle" fill="#94a3b8" font-size="10">Defesa contra Prompt Injection</text>

    <!-- Estado & Hooks -->
    <rect x="610" y="36" width="265" height="46" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="742" y="56" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Hooks de Negócio &amp; Auth</text>
    <text x="742" y="71" text-anchor="middle" fill="#94a3b8" font-size="10">AuthContext • Firestore Listeners</text>
  </g>

  <!-- Conexões para IA e Backend -->
  <path d="M 320 310 L 320 345" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow-ai)"/>
  <path d="M 680 310 L 680 345" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-db)"/>

  <!-- 3. CAMADA DE IA -->
  <g transform="translate(50, 345)" filter="url(#shadow)">
    <rect width="430" height="190" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="20" y="24" fill="#f472b6" font-size="12" font-weight="700" letter-spacing="0.5">3. MOTOR DE IA (MULTI-PROVEDOR &amp; FALLBACK)</text>

    <!-- Provedor 1 -->
    <rect x="25" y="40" width="380" height="38" rx="6" fill="#0f172a" stroke="#ec4899"/>
    <text x="215" y="57" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">1º Provedor: Groq Cloud (Llama 3.1 8B)</text>
    <text x="215" y="70" text-anchor="middle" fill="#ec4899" font-size="10">Triagem Semântica • JSON Estruturado de Urgência</text>

    <path d="M 215 78 L 215 88" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-ai)"/>

    <!-- Provedor 2 -->
    <rect x="25" y="90" width="380" height="38" rx="6" fill="#0f172a" stroke="#a855f7"/>
    <text x="215" y="107" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">2º Provedor: Google Gemini API (Flash)</text>
    <text x="215" y="120" text-anchor="middle" fill="#c084fc" font-size="10">Fallback Automático em 429/403 • Refinador de Tom</text>

    <path d="M 215 128 L 215 138" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-ai)"/>

    <!-- Contingência -->
    <rect x="25" y="140" width="380" height="38" rx="6" fill="#0f172a" stroke="#64748b"/>
    <text x="215" y="157" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Contingência Local: Motor Determinístico</text>
    <text x="215" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">Regras por Palavras-Chave (Zero Queda Offline)</text>
  </g>

  <!-- 4. CAMADA BACKEND -->
  <g transform="translate(520, 345)" filter="url(#shadow)">
    <rect width="430" height="190" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="24" fill="#34d399" font-size="12" font-weight="700" letter-spacing="0.5">4. BACKEND &amp; PERSISTÊNCIA (FIREBASE CLOUD)</text>

    <!-- Auth -->
    <rect x="25" y="40" width="380" height="38" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="215" y="57" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Firebase Authentication</text>
    <text x="215" y="70" text-anchor="middle" fill="#34d399" font-size="10">Tokens JWT • Sessão • Controle de Papéis</text>

    <!-- Firestore -->
    <rect x="25" y="90" width="380" height="38" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="215" y="107" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Cloud Firestore (NoSQL)</text>
    <text x="215" y="120" text-anchor="middle" fill="#34d399" font-size="10">Coleções: condominios, ocorrencias, avisos, unidades</text>

    <!-- Rules -->
    <rect x="25" y="140" width="380" height="38" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="215" y="157" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="600">Firestore Security Rules</text>
    <text x="215" y="170" text-anchor="middle" fill="#6ee7b7" font-size="10">Isolamento Rigoroso de Dados e Validação de Escrita</text>
  </g>

  <!-- 5. QUALIDADE -->
  <g transform="translate(50, 560)" filter="url(#shadow)">
    <rect width="900" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" fill="#cbd5e1" font-size="12" font-weight="700" letter-spacing="0.5">5. ESTEIRA DE QUALIDADE &amp; GOVERNANÇA TÉCNICA</text>

    <rect x="25" y="36" width="270" height="38" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="160" y="53" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">141 Testes Unitários</text>
    <text x="160" y="66" text-anchor="middle" fill="#94a3b8" font-size="10">Vitest: 100% de Aprovação</text>

    <rect x="315" y="36" width="270" height="38" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="450" y="53" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">Linter &amp; Tipagem Estrita</text>
    <text x="450" y="66" text-anchor="middle" fill="#94a3b8" font-size="10">ESLint 9 • TypeScript-ESLint • Oxlint</text>

    <rect x="605" y="36" width="270" height="38" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="740" y="53" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">Travas no Git (Husky)</text>
    <text x="740" y="66" text-anchor="middle" fill="#94a3b8" font-size="10">Pre-commit • Conventional Commits</text>
  </g>
</svg>
