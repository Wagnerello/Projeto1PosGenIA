<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitetura da Aplicação — Demonstração Técnica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wrapper {
      width: 100%;
      max-width: 1100px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .tip {
      margin-top: 14px;
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
    }
    .tip kbd {
      background: #1e293b;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <object data="arquitetura.svg" type="image/svg+xml" style="width: 100%; height: auto; display: block;">
      Seu navegador não suporta SVG.
    </object>
  </div>
  <p class="tip">Dica para a gravação: pressione <kbd>F11</kbd> no navegador para colocar esta tela em modo apresentação cheia.</p>
</body>
</html>
